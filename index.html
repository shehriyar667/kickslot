<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KickSlot</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#030504;--card:#09110c;--c2:#0e1b13;--line:#173223;--g:#1fbf63;--g2:#0b5230;--tx:#e8f4ec;--mut:#7d9887;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.dp{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.2px}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(700px 380px at 50% -8%,#0c3a21,transparent 70%)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{font-size:28px;font-weight:800}.logo b{color:var(--g)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--g),var(--g2));display:grid;place-items:center;font-weight:700;color:#021308;border:0;cursor:pointer;flex:none}
main{flex:1;overflow:auto;padding:14px 16px 20px}
nav{display:flex;border-top:1px solid var(--line);background:#050a07}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font:500 11px "DM Sans";cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:var(--g);color:#021308;border:0;border-radius:12px;padding:10px 16px;font:700 14px "DM Sans";cursor:pointer}
.btn.gh{background:transparent;color:var(--g);border:1px solid var(--g2)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
input,select,textarea{width:100%;background:var(--c2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:13px}.g{color:var(--g)}
.chip{display:inline-block;border:1px solid var(--line);color:var(--tx);background:var(--c2);border-radius:99px;padding:6px 12px;font:500 13px "DM Sans";margin:0 6px 6px 0;cursor:pointer}
.chip.on{background:var(--g);color:#021308;border-color:var(--g)}.chip.x{opacity:.35;text-decoration:line-through;cursor:default}
.pos{font:700 12px "DM Sans";border-radius:8px;padding:2px 8px;background:var(--g2);color:#b9f5d2}
.pic{height:150px;border-radius:12px;display:grid;place-items:center;font-size:64px;margin:10px 0;background:linear-gradient(135deg,#0b3d23,#031009 70%)}
.hero{text-align:center;padding:36px 0 14px}.hero .logo{font-size:56px;line-height:1}
.mo{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet{width:100%;max-width:480px;background:var(--c2);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g);color:#021308;font-weight:700;padding:10px 16px;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}
.bar{height:7px;background:#12261b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line)}.bub.me{margin-left:auto;background:var(--g2);border-color:var(--g2)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .chip{flex:1;text-align:center;margin:0;padding:9px}
.big{font:800 34px "Barlow Condensed"}
.btn,.chip,nav button,.pos{font-family:"DM Sans",system-ui,sans-serif}.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style></head><body><div id="app"></div><div class="mo" id="mo" onclick="if(event.target===this)closeM()"><div class="sheet" id="sh"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pk=n=>"PKR "+Math.round(n).toLocaleString();
const SL=["5 PM","6 PM","7 PM","8 PM","9 PM","10 PM","11 PM"];
const users={"123":{pw:"123",name:"Ali Raza",pos:"ATT"}};
let U=null,tab="feed",mode="in",sub="tour",pf="All",my=[];
const courts=[
{id:1,n:"Clifton Futsal Arena",a:"Clifton",p:6000,r:4.8,t:"5v5",b:["8 PM","9 PM"]},
{id:2,n:"DHA Kick Dome",a:"DHA",p:7500,r:4.9,t:"7v7",b:["7 PM","10 PM"]},
{id:3,n:"Gulshan Indoor Turf",a:"Gulshan",p:4000,r:4.5,t:"5v5",b:["6 PM"]},
{id:4,n:"Nazimabad Futsal Hub",a:"North Nazimabad",p:3500,r:4.3,t:"5v5",b:["9 PM","10 PM","11 PM"]},
{id:5,n:"PECHS Pro Arena",a:"PECHS",p:5000,r:4.6,t:"6v6",b:["8 PM"]},
{id:6,n:"Bahria Dome",a:"Bahria Town",p:8000,r:4.7,t:"7v7",b:[]}];
const P=[
{u:"Hamza Khan",pos:"ATT",txt:"Hat-trick in last night’s final at DHA Kick Dome. Team Falcons lift the cup!",e:"🏆",l:42},
{u:"Bilal Ahmed",pos:"GK",txt:"Clean sheet for the third match in a row. Saved a penalty in the last minute.",e:"🧤",l:31},
{u:"Sara Malik",pos:"MID",txt:"Assist machine this week with 7 assists in 4 matches. Thanks for the passes, team!",e:"👟",l:27}];
const pl=[
{n:"Hamza Khan",pos:"ATT",r:8.9,m:64,g:58,s:[88,91,76,38,72]},{n:"Bilal Ahmed",pos:"GK",r:8.6,m:71,g:0,s:[58,40,66,90,78]},
{n:"Sara Malik",pos:"MID",r:8.4,m:52,g:19,s:[80,74,90,66,70]},{n:"Daniyal Shah",pos:"DEF",r:8.2,m:60,g:6,s:[70,50,72,89,86]},
{n:"Ali Raza",pos:"ATT",r:7.9,m:35,g:30,s:[82,84,70,34,68]},{n:"Zain Qureshi",pos:"DEF",r:7.7,m:44,g:4,s:[66,44,68,84,82]},
{n:"Usman Tariq",pos:"MID",r:7.6,m:48,g:12,s:[75,70,83,62,69]},{n:"Faizan Ali",pos:"GK",r:7.4,m:39,g:0,s:[52,38,60,84,72]}];
const T=[
{n:"Karachi Night Cup",d:"Sat 21 Nov at 7 PM",v:"DHA Kick Dome",f:3000,m:8,c:5,pr:60000,by:"Kick Dome Events"},
{n:"Clifton Futsal League",d:"Sun 29 Nov at 6 PM",v:"Clifton Futsal Arena",f:2500,m:12,c:9,pr:40000,by:"Clifton FC"},
{n:"Gulshan 5-a-side Blitz",d:"Fri 4 Dec at 8 PM",v:"Gulshan Indoor Turf",f:1500,m:16,c:6,pr:25000,by:"Gulshan Strikers"}];
const R=[
{by:"Bilal (Team Falcons)",pos:"GK",c:"Clifton Futsal Arena",t:"Tonight at 9 PM",fee:700,lvl:"Intermediate"},
{by:"Zain (Gulshan United)",pos:"DEF",c:"Gulshan Indoor Turf",t:"Tomorrow at 8 PM",fee:500,lvl:"Casual"},
{by:"Team Strikers",pos:"ATT",c:"DHA Kick Dome",t:"Friday at 10 PM",fee:900,lvl:"Competitive"}];
const free=c=>SL.filter(s=>!c.b.includes(s)),ini=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2600)}
function openM(h){$("#sh").innerHTML=h;$("#mo").style.display="flex"}function closeM(){$("#mo").style.display="none"}
function login(){render()}
function auth(){const id=$("#id").value.trim(),pw=$("#pw").value;
 if(mode==="up"){const nm=$("#nm").value.trim();if(!nm||!id||!pw)return toast("Fill in every field to sign up");users[id]={pw,name:nm,pos:$("#ps").value};U=users[id]}
 else{const u=users[id];if(!u||u.pw!==pw)return toast("Wrong ID or password. Try 123 and 123");U=u}
 tab="feed";render()}
function render(){
 const A=$("#app");
 if(!U){A.innerHTML=`<main style="display:flex;flex-direction:column;justify-content:center"><div class="hero"><div class="logo dp">Kick<b>Slot</b></div><p class="mut" style="margin-top:6px">Find a court. Fill your squad. Play tonight.</p>
 <svg viewBox="0 0 220 110" width="220" style="margin:18px auto 0;display:block" fill="none" stroke="#1fbf63" stroke-width="2" opacity=".75"><rect x="4" y="4" width="212" height="102" rx="6"/><line x1="110" y1="4" x2="110" y2="106"/><circle cx="110" cy="55" r="18"/><rect x="4" y="30" width="34" height="50"/><rect x="182" y="30" width="34" height="50"/></svg></div>
 <div class="seg"><button class="chip ${mode=="in"?"on":""}" onclick="mode='in';render()">Log in</button><button class="chip ${mode=="up"?"on":""}" onclick="mode='up';render()">Sign up</button></div>
 ${mode=="up"?`<input id="nm" placeholder="Full name" autocomplete="name"><select id="ps"><option value="ATT">Attacker</option><option value="MID">Midfielder</option><option value="DEF">Defender</option><option value="GK">Goalkeeper</option></select>`:""}
 <input id="id" placeholder="Player ID" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth()">
 <button class="btn" onclick="auth()">${mode=="in"?"Log in":"Create account"}</button><p class="mut" style="text-align:center;margin-top:12px">Demo login: ID 123, password 123</p><p class="mut" style="text-align:center;margin-top:18px">Made By Muhammad Shehriyar</p></main>`;return}
 const tabs=[["feed","🏠","Feed"],["courts","🏟️","Courts"],["agent","🤖","Book"],["events","🏆","Events"],["players","👥","Players"]];
 A.innerHTML=`<header><div class="logo dp">Kick<b>Slot</b></div><div class="row"><button class="av" style="background:var(--c2);border:1px solid var(--line)" aria-label="Messages" onclick="inbox()">💬</button><button class="av" aria-label="Profile" onclick="profile()">${ini(U.name)}</button></div></header><main id="mn"></main><div class="mut" style="text-align:center;font-size:11px;padding:5px 0;border-top:1px solid var(--line)">Made By Muhammad Shehriyar</div><nav>${tabs.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join("")}</nav>`;
 ({feed,courtsV,agent,events,players})[tab==="courts"?"courtsV":tab]();
}
function profile(){openM(`<div class="row"><div class="av" style="width:52px;height:52px;font-size:20px">${ini(U.name)}</div><div><h2 style="font-size:26px">${esc(U.name)}</h2><span class="pos">${U.pos}</span></div></div>
<h3 style="margin:16px 0 8px;font-size:20px">My bookings</h3>${my.length?my.map(b=>`<div class="card"><b>${b.n}</b><div class="mut">${b.s} for ${b.m} players, ${pk(b.p)} total</div><div class="g">Ref ${b.ref}</div></div>`).join(""):'<p class="mut">No bookings yet. Open Courts to book your first slot.</p>'}
<button class="btn gh" style="width:100%;margin-top:8px" onclick="U=null;closeM();render()">Log out</button>`)}
/* FEED */
function feed(){$("#mn").innerHTML=`<div class="card"><textarea id="pt" rows="2" placeholder="Share a goal, win or achievement..."></textarea><div class="row sp"><div id="em">${["⚽","🏆","🧤","🥅","👟","🔥"].map((e,i)=>`<span class="chip ${i?"":"on"}" onclick="pe(this)">${e}</span>`).join("")}</div><button class="btn sm" onclick="post()">Post</button></div></div>`+P.map((p,i)=>`<div class="card"><div class="row"><div class="av">${ini(p.u)}</div><div><b>${p.u}</b> <span class="pos">${p.pos}</span><div class="mut">Just now</div></div></div><p style="margin-top:10px">${esc(p.txt)}</p><div class="pic">${p.e}</div><button class="chip ${p.k?"on":""}" onclick="lk(${i})">⚽ ${p.l+(p.k?1:0)} Nice play</button></div>`).join("")}
function pe(e){document.querySelectorAll("#em .chip").forEach(c=>c.classList.remove("on"));e.classList.add("on")}
function lk(i){P[i].k=!P[i].k;feed()}
function post(){const t=$("#pt").value.trim();if(!/goal|match|win|won|football|futsal|assist|trophy|cup|clean sheet|hat-trick|tournament|save|kick|team|pitch|penalty|keeper|striker|defend|league|final/i.test(t))return toast("KickSlot is football only. Mention your match, goal or team.");
 P.unshift({u:U.name,pos:U.pos,txt:t,e:$("#em .on").textContent,l:0});feed();toast("Posted to the feed")}
/* COURTS */
function courtsV(){$("#mn").innerHTML=`<h2 style="font-size:30px;margin-bottom:10px">Indoor courts in Karachi</h2><div class="seg"><button class="chip ${cv=="list"?"on":""}" onclick="cv='list';courtsV()">List</button><button class="chip ${cv=="map"?"on":""}" onclick="cv='map';courtsV()">Map</button></div>`+(cv=="list"?`<input id="q" placeholder="Search area, like Gulshan or DHA" oninput="cl()"><div id="cl"></div>`:mapV());if(cv=="list")cl()}
function cl(){const q=($("#q")||{value:""}).value.toLowerCase();$("#cl").innerHTML=courts.filter(c=>(c.n+c.a).toLowerCase().includes(q)).map(c=>`<div class="card"><div class="row sp"><div><h3 style="font-size:22px">${c.n}</h3><div class="mut">${c.a}, Karachi</div></div><div class="g">★ ${c.r}</div></div>
<div class="row sp" style="margin:8px 0"><span class="pos">${c.t} indoor</span><b>${pk(c.p)} per hour</b></div>${SL.map(s=>`<span class="chip ${c.b.includes(s)?"x":""}" ${c.b.includes(s)?"":`onclick="bookM(${c.id},'${s}')"`}>${s}</span>`).join("")}</div>`).join("")||'<p class="mut">No courts match that area. Try another name.</p>'}
function bookM(id,s,m){const c=courts.find(x=>x.id==id);m=m||10;openM(`<h2 style="font-size:28px">${c.n}</h2><p class="mut">${c.a}, Karachi</p>
<label class="mut">Time slot</label><select id="bs">${free(c).map(x=>`<option ${x==s?"selected":""}>${x}</option>`).join("")}</select>
<label class="mut">Players</label><input id="bm" type="number" min="2" max="22" value="${m}" oninput="bt(${id})"><div class="card"><div class="row sp"><span>Court total</span><b>${pk(c.p)}</b></div><div class="row sp"><span>Per player</span><b class="g" id="bp">${pk(c.p/m)}</b></div></div><button class="btn" style="width:100%" onclick="book(${id})">Confirm booking</button>`)}
function bt(id){const c=courts.find(x=>x.id==id),m=Math.max(2,+$("#bm").value||2);$("#bp").textContent=pk(c.p/m)}
function book(id){const c=courts.find(x=>x.id==id),s=$("#bs").value,m=+$("#bm").value||10;c.b.push(s);const ref="KS-"+Math.floor(1000+Math.random()*9000);my.push({n:c.n,s,m,p:c.p,ref});closeM();toast("Booked "+s+" at "+c.n+". Ref "+ref);if(tab==="courts")courtsV();else if(tab==="agent")agent()}
/* AI AGENT */
let msgs=[{me:0,h:"Hi "+"there! Tell me what you need, for example: <i>10 players, 8 PM, budget 6000 in Clifton</i>. I will find a court and book it for you."}];
function agent(){$("#mn").innerHTML=`<div id="ch">${msgs.map(m=>`<div class="bub ${m.me?"me":""}">${m.h}</div>`).join("")}</div><div style="position:sticky;bottom:-20px;background:var(--bg);padding:8px 0 0">${["10 players, 8 PM, budget 6000","Gulshan under 4500","7 PM in DHA for 14 players"].map(t=>`<span class="chip" onclick="send('${t}')">${t}</span>`).join("")}<div class="row"><input id="ai" style="margin:0" placeholder="Type your request" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div>`;$("#mn").scrollTop=1e5}
function send(t){const i=$("#ai");t=t||i.value.trim();if(!t)return;msgs.push({me:1,h:esc(t)});msgs.push({me:0,h:"Checking courts..."});agent();setTimeout(()=>{msgs.pop();msgs.push({me:0,h:reply(t)});agent()},700)}
function reply(t){const l=t.toLowerCase();let bud=null,tm=null,mem=null,m=l.match(/(\d+(?:\.\d+)?)\s*k\b/);if(m)bud=m[1]*1000;
 m=l.match(/(?:budget|under|below|within|max|upto|up to)\D{0,6}(\d[\d,]{2,})/)||l.match(/(?:rs\.?|pkr)\s*(\d[\d,]{2,})/);if(m)bud=+m[1].replace(/,/g,"");
 m=l.match(/(\d{1,2})\s*(am|pm)/);if(m)tm=m[1]+" "+m[2].toUpperCase();m=l.match(/(\d+)\s*(players|player|members|people|guys|friends)/);mem=m?+m[1]:10;
 const ar=courts.filter(c=>l.includes(c.a.split(" ")[0].toLowerCase()));if(tm&&!SL.includes(tm))tm=null;
 const r=courts.filter(c=>(!bud||c.p<=bud)&&(!tm||!c.b.includes(tm))&&(!ar.length||ar.includes(c))&&free(c).length).sort((a,b)=>b.r-a.r).slice(0,3);
 if(!r.length)return "No court fits that. Try a higher budget, another time between 5 PM and 11 PM, or a different area.";
 return "Found "+r.length+" match"+(r.length>1?"es":"")+" for "+mem+" players"+(bud?" under "+pk(bud):"")+(tm?" at "+tm:"")+":"+r.map(c=>{const sl=tm?[tm]:free(c).slice(0,3);return `<div class="card" style="margin:8px 0 0"><b>${c.n}</b> <span class="g">★ ${c.r}</span><div class="mut">${c.a}, ${pk(c.p)} per hour, about ${pk(c.p/mem)} each</div><div style="margin-top:6px">${sl.map(s=>`<span class="chip on" onclick="bookM(${c.id},'${s}',${mem})">Book ${s}</span>`).join("")}</div></div>`}).join("")}
/* EVENTS */
function events(){$("#mn").innerHTML=`<div class="seg"><button class="chip ${sub=="tour"?"on":""}" onclick="sub='tour';events()">Tournaments</button><button class="chip ${sub=="req"?"on":""}" onclick="sub='req';events()">Need a player</button></div>`+(sub=="tour"?`<button class="btn gh" style="width:100%;margin-bottom:12px" onclick="tourM()">Organize a tournament</button>`+T.map((t,i)=>`<div class="card"><div class="row sp"><h3 style="font-size:24px">${esc(t.n)}</h3><span class="pos">Prize ${pk(t.pr)}</span></div><div class="mut">${t.d}, ${t.v}<br>Hosted by ${esc(t.by)}</div><div class="bar" style="margin:10px 0 6px"><i style="width:${t.c/t.m*100}%"></i></div><div class="row sp"><span class="mut">${t.c} of ${t.m} teams, ${pk(t.f)} entry</span><button class="btn sm ${t.x?"gh":""}" onclick="reg(${i})">${t.x?"Registered":"Register team"}</button></div></div>`).join(""):`<button class="btn gh" style="width:100%;margin-bottom:12px" onclick="reqM()">Post a request, 1 player short</button>`+R.map((r,i)=>`<div class="card"><div class="row sp"><b>${esc(r.by)} needs a <span class="pos">${r.pos}</span></b><span class="g">${pk(r.fee)}</span></div><div class="mut" style="margin:4px 0 10px">${r.c}, ${r.t}, level ${r.lvl}</div><button class="btn sm ${r.x?"gh":""}" ${r.x?"disabled":""} onclick="acc(${i})">${r.x?"You’re in":"Accept and join"}</button></div>`).join(""))}
function reg(i){const t=T[i];if(t.x)return;t.x=1;t.c++;events();toast("Team registered for "+t.n)}
function acc(i){R[i].x=1;events();toast("You’re in! "+R[i].c+", "+R[i].t)}
function tourM(){openM(`<h2 style="font-size:28px">New tournament</h2><input id="tn" placeholder="Tournament name"><input id="td" placeholder="Date and time, like Sat 12 Dec at 7 PM"><select id="tv">${courts.map(c=>`<option>${c.n}</option>`).join("")}</select><input id="tf" type="number" placeholder="Entry fee per team (PKR)"><input id="tm" type="number" placeholder="Maximum teams"><button class="btn" style="width:100%" onclick="mkT()">Publish tournament</button>`)}
function mkT(){const n=$("#tn").value.trim(),d=$("#td").value.trim(),f=+$("#tf").value,m=+$("#tm").value;if(!n||!d||!f||!m)return toast("Fill in every field");T.unshift({n,d,v:$("#tv").value,f,m,c:0,pr:f*m*0.7,by:U.name+" (you)"});closeM();events();toast("Tournament published. Teams can now register")}
function reqM(){openM(`<h2 style="font-size:28px">Need a player</h2><select id="rp"><option value="GK">Goalkeeper</option><option value="DEF">Defender</option><option value="MID">Midfielder</option><option value="ATT">Attacker</option></select><select id="rc">${my.length?my.map(b=>`<option>${b.n}</option>`).join(""):courts.map(c=>`<option>${c.n}</option>`).join("")}</select><select id="rt">${SL.map(s=>`<option>Tonight at ${s}</option>`).join("")}</select><input id="rf" type="number" placeholder="Fee per player (PKR)" value="600"><button class="btn" style="width:100%" onclick="mkR()">Post request</button>`)}
function mkR(){R.unshift({by:U.name+" (you)",pos:$("#rp").value,c:$("#rc").value,t:$("#rt").value,fee:+$("#rf").value||0,lvl:"Open"});closeM();events();toast("Request posted. Players nearby can see it")}
/* MAP AND CHAT */
let cv="list",ms=0;const CH={},XY={1:[105,322],2:[170,352],3:[268,178],4:[168,118],5:[190,238],6:[322,52]};
function mapV(){const c0=courts.find(x=>x.id==ms);return `<svg viewBox="0 0 360 420" style="width:100%;border-radius:16px;border:1px solid var(--line);background:#06100a;margin-bottom:12px"><path d="M0 300C60 292 95 345 140 372C175 394 205 402 232 420L0 420Z" fill="#082a45"/><text x="24" y="402" fill="#4b8fc2" font-size="12">Arabian Sea</text><g stroke="#173223" stroke-width="5" fill="none" stroke-linecap="round"><path d="M105 322L190 238L268 178L322 52"/><path d="M168 118L190 238L170 352"/><path d="M105 322L170 352"/></g>${courts.map(c=>{const [x,y]=XY[c.id],s=ms==c.id;return `<g onclick="ms=${c.id};courtsV()" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${s?17:13}" fill="${s?"#1fbf63":"#0b5230"}" stroke="#1fbf63" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14">⚽</text><text x="${x}" y="${y+32}" text-anchor="middle" fill="#cfe9d8" font-size="11" font-weight="700">${c.a}</text></g>`}).join("")}</svg>`+(c0?`<div class="card"><div class="row sp"><div><h3 style="font-size:22px">${c0.n}</h3><div class="mut">${c0.a}, Karachi</div></div><div class="g">★ ${c0.r}</div></div><div class="row sp" style="margin:8px 0"><span class="pos">${c0.t} indoor</span><b>${pk(c0.p)} per hour</b></div>${SL.map(s=>`<span class="chip ${c0.b.includes(s)?"x":""}" ${c0.b.includes(s)?"":`onclick="bookM(${c0.id},'${s}')"`}>${s}</span>`).join("")}</div>`:'<p class="mut">Tap a pin to see open slots and book.</p>')}
function chatM(n){const p=pl.find(x=>x.n==n),h=CH[n]=CH[n]||[{me:0,h:"Hey! Saw you on KickSlot. Up for a match?"}];openM(`<div class="row sp" style="margin-bottom:10px"><div class="row"><div class="av">${ini(n)}</div><div><b>${n}</b><div class="mut">${p.pos}, online</div></div></div><button class="chip" style="margin:0" onclick="inbox()">All chats</button></div><div id="cm" data-n="${n}" style="max-height:44vh;overflow:auto">${h.map(m=>`<div class="bub ${m.me?"me":""}">${m.h}</div>`).join("")}</div><div class="row" style="margin-top:8px"><input id="ci" style="margin:0" placeholder="Message ${n.split(" ")[0]}" onkeydown="if(event.key==='Enter')cs('${n}')"><button class="btn" onclick="cs('${n}')">Send</button></div>`);$("#cm").scrollTop=1e5;$("#ci").focus()}
function cs(n){const i=$("#ci"),t=i.value.trim();if(!t)return;CH[n].push({me:1,h:esc(t)});chatM(n);setTimeout(()=>{CH[n].push({me:0,h:autoRep(t)});const c=$("#cm");if($("#mo").style.display=="flex"&&c&&c.dataset.n==n)chatM(n);else toast(n.split(" ")[0]+" replied to you")},900)}
function autoRep(t){const l=t.toLowerCase();return /book|court|slot/.test(l)?"Send me the slot and I’ll confirm right away.":/price|fee|pay|split/.test(l)?"Splitting equally works for me.":/tonight|today|tomorrow|free|available/.test(l)?"I’m free. Which court and what time?":/need|short|keeper|gk|defender|striker/.test(l)?"Count me in. Share the details and I’ll be there.":"Sounds good! Let’s lock it in."}
function inbox(){const ks=Object.keys(CH);openM(`<h2 style="font-size:28px;margin-bottom:10px">Messages</h2>`+(ks.length?ks.map(n=>{const l=CH[n][CH[n].length-1];return `<div class="card" style="cursor:pointer" onclick="chatM('${n}')"><div class="row"><div class="av">${ini(n)}</div><div style="min-width:0"><b>${n}</b><div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.me?"You: ":""}${l.h.replace(/<[^>]+>/g,"")}</div></div></div></div>`}).join(""):'<p class="mut">No chats yet. Pick a player below to start one.</p>')+`<p class="mut" style="margin:6px 0">Start a new chat</p>`+pl.map(p=>`<span class="chip" onclick="chatM('${p.n}')">${p.n.split(" ")[0]}, ${p.pos}</span>`).join(""))}
/* PLAYERS */
function players(){$("#mn").innerHTML=`<h2 style="font-size:30px;margin-bottom:10px">Player ratings</h2><div>${["All","ATT","MID","DEF","GK"].map(p=>`<span class="chip ${pf==p?"on":""}" onclick="pf='${p}';players()">${p}</span>`).join("")}</div>`+pl.filter(p=>pf=="All"||p.pos==pf).map(p=>`<div class="card" style="cursor:pointer" onclick="pM('${p.n}')"><div class="row"><div class="av">${ini(p.n)}</div><div style="flex:1"><b>${p.n}</b><div class="mut">${p.m} matches, ${p.g} goals</div></div><span class="pos">${p.pos}</span><div class="big g">${p.r}</div></div></div>`).join("")}
function pM(n){const p=pl.find(x=>x.n==n),L=["Pace","Shooting","Passing","Defending","Physical"],f={ATT:"Attacker",MID:"Midfielder",DEF:"Defender",GK:"Goalkeeper"}[p.pos];openM(`<div class="row"><div class="av" style="width:56px;height:56px;font-size:22px">${ini(p.n)}</div><div style="flex:1"><h2 style="font-size:28px">${p.n}</h2><span class="pos">${f}</span></div><div class="big g" style="font-size:46px">${p.r}</div></div><div class="row sp" style="margin:14px 0"><div class="card" style="flex:1;margin:0;text-align:center"><div class="big">${p.m}</div><div class="mut">Matches</div></div><div class="card" style="flex:1;margin:0;text-align:center"><div class="big">${p.g}</div><div class="mut">Goals</div></div></div>${p.s.map((v,i)=>`<div class="row sp mut"><span>${L[i]}</span><b style="color:var(--tx)">${v}</b></div><div class="bar" style="margin:4px 0 10px"><i style="width:${v}%"></i></div>`).join("")}<div class="row"><button class="btn gh" style="flex:1" onclick="chatM('${p.n}')">Message</button><button class="btn" style="flex:1" onclick="closeM();toast('Invite sent to ${p.n}')">Invite to my match</button></div>`)}
render();
</script></body></html>
